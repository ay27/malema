<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="骂了吗全球被骂榜：同一批 AI 编程工具与模型，在中文、英文会话里每千条真人消息被明确骂了几次。">
  <meta name="theme-color" content="#f7f9fc">
  <title>全球被骂榜 · 骂了吗</title>
  <link rel="icon" href="/mark.png" type="image/png">
  <link rel="stylesheet" href="/style.css">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="骂了吗 Malema">
  <meta property="og:title" content="全球被骂榜 · 骂了吗">
  <meta property="og:description" content="同一批 AI 编程工具与模型，在中文、英文会话里每千条真人消息被明确骂了几次。">
  <meta property="og:url" content="https://malema.app/">
  <meta property="og:image" content="https://malema.app/card.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:locale:alternate" content="en_US">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="全球被骂榜 · 骂了吗">
  <meta name="twitter:description" content="同一批 AI 编程工具与模型，每千条真人消息被明确骂了几次。">
  <meta name="twitter:image" content="https://malema.app/card.png">

  <script src="/board.js" type="module"></script>
</head>
<body>
  <a class="skip-link" href="#title" data-text="skip">跳到榜单</a>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="/"><img src="/mark.png" alt="" width="34" height="34"><span data-text="brand">骂了吗</span></a>
      <nav aria-label="导航" data-label="navigation">
        <button id="interface-language" type="button" aria-label="Switch interface to English">EN</button>
      </nav>
    </div>
  </header>
  <main>
    <section class="hero" aria-labelledby="title">
      <div class="hero-copy">
        <h1 id="title" data-text="title">全球被骂榜</h1>
        <p class="hero-lede" data-text="tagline">每千条真人消息里，AI 被明确骂了几次。</p>
      </div>
      <div class="hero-meta">
        <label for="period" data-text="period">统计期次</label>
        <div class="select"><select id="period">
          <option value="current" data-text="current">本期</option>
          <option value="previous" data-text="previous">上期</option>
        </select></div>
        <span id="period-range"></span>
      </div>
    </section>

    <section class="controls" aria-label="榜单筛选" data-label="filters">
      <div>
        <span class="field-label" data-text="messageLanguage">消息语言</span>
        <div class="segments" id="language-filter" role="group" aria-label="消息语言" data-label="messageLanguage">
          <button data-language="all" type="button" aria-pressed="true" data-text="allLanguages">全部</button>
          <button data-language="zh" type="button" aria-pressed="false">中文</button>
          <button data-language="en" type="button" aria-pressed="false">English</button>
        </div>
      </div>
      <label><span class="field-label" data-text="harness">运行工具</span>
        <span class="select"><select id="harness"><option value="" data-text="allHarnesses">全部工具</option></select></span>
      </label>
      <label class="model-field"><span class="field-label" data-text="model">回复模型</span>
        <span class="select"><select id="model"><option value="" data-text="allModels">全部模型</option></select></span>
      </label>
    </section>

    <div id="skeleton" class="skeleton" aria-hidden="true">
      <div class="stat-row"><span></span><span></span><span></span><span></span></div>
      <div class="panel"><span class="line w60"></span><span class="line w40"></span><span class="line"></span><span class="line"></span><span class="line w80"></span></div>
    </div>

    <section class="stat-row" id="stats" aria-label="汇总" data-label="summary" hidden></section>

    <div id="content" hidden>
      <section class="panel" id="chart-panel" aria-labelledby="chart-title">
        <div class="panel-head">
          <div><h2 id="chart-title" data-text="compare">组合对比</h2><p id="chart-hint" class="panel-hint"></p></div>
          <ul id="legend" class="legend" hidden>
            <li><i class="key zh"></i><span data-text="zhLabel">中文</span></li>
            <li><i class="key en"></i><span data-text="enLabel">English</span></li>
          </ul>
        </div>
        <div id="bars" class="bars"></div>
        <div id="chart-axis" class="chart-axis" aria-hidden="true"></div>
      </section>

      <section class="panel table-panel" id="table-panel" aria-labelledby="detail-title">
        <div class="panel-head">
          <div><h2 id="detail-title" data-text="details">组合明细</h2><p id="refresh" class="panel-hint" aria-live="polite"></p></div>
          <span id="result-count" class="pill"></span>
        </div>
        <div class="scroll">
          <table>
            <thead><tr>
              <th scope="col" class="rank"><span data-text="rank">名次</span></th>
              <th scope="col" class="change"><span data-text="change">变化</span></th>
              <th scope="col"><button data-sort="harness"><span data-text="harness">运行工具</span><i aria-hidden="true"></i></button></th>
              <th scope="col"><button data-sort="model"><span data-text="model">回复模型</span><i aria-hidden="true"></i></button></th>
              <th scope="col" class="numeric"><button data-sort="turns"><span data-text="turns">真人消息</span><i aria-hidden="true"></i></button></th>
              <th scope="col" class="numeric"><button data-sort="hits"><span data-text="hits">明确挨骂</span><i aria-hidden="true"></i></button></th>
              <th scope="col" class="numeric" aria-sort="descending"><button data-sort="score"><span data-text="score">被骂指数</span><i aria-hidden="true"></i></button></th>
            </tr></thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </section>
    </div>

    <section id="empty" class="empty" hidden>
      <img src="/mark.png" alt="" width="56" height="56">
      <h2 id="empty-title">正在读取榜单</h2>
      <p id="empty-details"></p>
      <button type="button" id="retry" hidden data-text="retry">再试一次</button>
    </section>
  </main>
  <footer>
    <span>malema.app</span>
    <a href="https://github.com/ay27/malema">github.com/ay27/malema</a>
    <a href="#title" data-text="top">回到顶部 ↑</a>
  </footer>
</body>
</html>
