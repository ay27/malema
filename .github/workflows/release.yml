name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release-macos:
    if: github.ref_type == 'tag'
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    outputs:
      archive_sha256: ${{ steps.homebrew.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check tag and install Rust
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$version"
          rustup toolchain install 1.93.0 --profile minimal

      - name: Test and build
        run: |
          cargo +1.93.0 test --locked --release
          cargo +1.93.0 build --locked --release

      - name: Download Sparkle
        run: |
          archive="$RUNNER_TEMP/Sparkle-2.10.1.tar.xz"
          curl --fail --location --retry 3 \
            https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz \
            --output "$archive"
          echo "1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27  $archive" | shasum -a 256 -c -
          mkdir "$RUNNER_TEMP/sparkle"
          tar -xJf "$archive" -C "$RUNNER_TEMP/sparkle"

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@95e84a1a18f2bdbc5c6ab9b7f4429372e4b13a8b # v5
        with:
          p12-file-base64: ${{ secrets.CSC_LINK }}
          p12-password: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Sign, notarize, and prepare update
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MALEMA_SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/release-macos.sh target/release/malema "$RUNNER_TEMP/sparkle" dist

      - name: Publish install and update assets together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft); then
            if [[ "$draft" != true ]]; then
              echo "This tag already has a published release." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber \
              dist/malema-macos-arm64.zip dist/appcast.xml
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --verify-tag --draft --generate-notes --title "$GITHUB_REF_NAME" \
              dist/malema-macos-arm64.zip dist/appcast.xml
          fi
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Record published archive checksum
        id: homebrew
        run: shasum -a 256 dist/malema-macos-arm64.zip | awk '{print "sha256=" $1}' >> "$GITHUB_OUTPUT"

  update-homebrew-cask:
    needs: release-macos
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Update the Homebrew Cask on main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_SHA256: ${{ needs.release-macos.outputs.archive_sha256 }}
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          if [[ "$latest" != "$GITHUB_REF_NAME" ]]; then
            echo "The tag is not the latest release."
            exit 0
          fi

          cask_api="repos/$GITHUB_REPOSITORY/contents/Casks/malema.rb"
          gh api "$cask_api?ref=main" > "$RUNNER_TEMP/cask.json"
          jq -er '.content' "$RUNNER_TEMP/cask.json" | base64 --decode > "$RUNNER_TEMP/malema.rb"
          ruby - "$RUNNER_TEMP/malema.rb" "$version" "$ARCHIVE_SHA256" > "$RUNNER_TEMP/updated.rb" <<'RUBY'
          path, version, sha256 = ARGV
          cask = File.read(path)
          abort "Missing Cask version" unless cask.sub!(/^  version "[^"\n]+"$/, "  version #{version.inspect}")
          abort "Missing Cask checksum" unless cask.sub!(/^  sha256 "[a-f0-9]{64}"$/, "  sha256 #{sha256.inspect}")
          print cask
          RUBY
          ruby -c "$RUNNER_TEMP/updated.rb"
          if cmp -s "$RUNNER_TEMP/malema.rb" "$RUNNER_TEMP/updated.rb"; then
            exit 0
          fi
          encoded_cask=$(base64 < "$RUNNER_TEMP/updated.rb" | tr -d '\n')
          cask_sha=$(jq -er '.sha' "$RUNNER_TEMP/cask.json")
          jq -n --arg message "Update Homebrew Cask to $version" \
            --arg content "$encoded_cask" --arg sha "$cask_sha" \
            '{branch: "main", message: $message, content: $content, sha: $sha}' > "$RUNNER_TEMP/update.json"
          gh api --method PUT "$cask_api" --input "$RUNNER_TEMP/update.json" --jq '.commit.sha'
