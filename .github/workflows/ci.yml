name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.93.0 --profile minimal
      - run: cargo +1.93.0 test --locked --release
      - run: cargo +1.93.0 build --locked --release
      - run: scripts/package-macos.sh target/release/malema 'dist/骂了吗.app'

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # The bundle is committed so deploys work without a build; fail when the
      # committed copy drifts from its source.
      - run: git diff --exit-code -- public/board.js
      - name: Check Wrangler configurations
        run: |
          for config in wrangler.jsonc wrangler.beta.jsonc wrangler.production.jsonc; do
            npx --no-install wrangler deploy --config "$config" --dry-run \
              --outdir "$RUNNER_TEMP/${config%.jsonc}"
          done
