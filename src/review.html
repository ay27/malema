<dialog id="review-dialog" aria-labelledby="review-title">
  <header class="review-header">
    <div><h2 id="review-title"><!-- REVIEW_TITLE --></h2><p class="subtle" id="review-range"></p></div>
    <button class="plain-btn" id="close-review" type="button"><!-- REVIEW_CLOSE --></button>
  </header>
  <form id="review-form">
    <div class="review-field"><span><!-- REVIEW_PROVIDER_LABEL --></span><!-- REVIEW_PROVIDER --></div>
    <div class="review-field"><span><!-- REVIEW_SCOPE_LABEL --></span><!-- REVIEW_SCOPE --></div>
    <div class="review-fields" id="review-jev" hidden>
      <label>TypeSafe API Key<input id="review-key" type="password" autocomplete="off" maxlength="4096" placeholder="<!-- REVIEW_KEY_PLACEHOLDER -->"></label>
    </div>
    <div class="review-fields" id="review-custom" hidden>
      <label><span id="review-endpoint-label"><!-- REVIEW_ENDPOINT_LABEL --></span><input id="review-endpoint" type="text" inputmode="url" autocomplete="off" spellcheck="false" maxlength="4096"></label>
      <label><!-- REVIEW_MODEL_LABEL --><input id="review-model" type="text" autocomplete="off" spellcheck="false" maxlength="128" placeholder="<!-- REVIEW_MODEL_PLACEHOLDER -->"></label>
      <label><!-- REVIEW_CUSTOM_KEY_LABEL --><input id="review-custom-key" type="password" autocomplete="off" maxlength="4096" placeholder="<!-- REVIEW_CUSTOM_KEY_PLACEHOLDER -->"></label>
    </div>
    <div class="review-actions">
      <p class="subtle"><!-- REVIEW_NOTE --></p>
      <button type="button" class="plain-btn" id="cancel-review" hidden><!-- REVIEW_STOP --></button>
      <button type="submit" class="plain-btn review-primary" id="start-review"><!-- REVIEW_START --></button>
    </div>
  </form>
  <div id="review-state" role="status" hidden></div>
  <div class="review-results" id="review-results" hidden></div>
</dialog>
