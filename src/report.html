<script id="report-data" type="application/json"><!-- MALEMA_DATA --></script>
<script>
const dataScript = document.getElementById("report-data");
if (document.querySelector(".shell")) init(JSON.parse(dataScript.textContent));

function init(initialData) {
  const $ = id => document.getElementById(id);
  const fmt = new Intl.NumberFormat("zh-CN");
  const colors = { "Codex":"#6689df", "Claude Code":"#c97b70", "DeepSeek Harness":"#6b9fc7",
    "WorkBuddy":"#4d9c89", "Cursor":"#927ac7", "pi":"#9c8757" };
  const today = new Date();
  const anchor = new Date(Date.UTC(today.getFullYear(), today.getMonth(), today.getDate()));
  const localDate = d => d.toISOString().slice(0,10);
  function dayBefore(offset) {
    const day = new Date(anchor);
    day.setUTCDate(day.getUTCDate() - offset);
    return localDate(day);
  }
  const shortDate = iso => iso.slice(5).replace("-", "/");
  const current = { view:"overview", days:0, source:"", metric:"turns", groups:"source", day:dayBefore(0), recordsDay:null };
  const indexView = { query:"", minimum:0, hitsOnly:false, sort:"score", direction:-1, metric:"score" };
  let data = initialData ?? {rows:[], clients:[]};
  let hasData = initialData !== null;
  let recordsLoaded = hasData;
  let records = [...$("record-list").children];
  const byDate = new Map();
  const el = (tag, type, text) => {
    const node = document.createElement(tag);
    if (type) node.className = type;
    if (text !== undefined) node.textContent = text;
    return node;
  };
  const within = (day, lower) => !lower || Boolean(day && day >= lower && day <= dayBefore(0));
  const onDate = row => !current.source || row.client === current.source;
  const marker = color => { const i = el("i","swatch"); i.style.setProperty("--swatch",color); return i; };
  const rates = (hits, turns) => turns ? (100 * hits / turns).toFixed(2) + "%" : "—";
  const sourceNames = Object.keys(colors);
  const selected = selector => [...document.querySelectorAll(selector)];

  function groups(rows, key) {
    const sum = new Map();
    for (const row of rows) {
      const id = key(row);
      const n = sum.get(id) || {turns:0, hits:0};
      n.turns += row.turns;
      n.hits += row.hits;
      sum.set(id,n);
    }
    return sum;
  }

  function bucket(day) {
    return byDate.get(day) || {turns:0, hits:0, byClient:new Map()};
  }

  function filteredReportRows() {
    const lower = current.days ? dayBefore(current.days - 1) : null;
    return data.rows.filter(row => onDate(row) && within(row.date, lower));
  }

  function refreshData() {
    const viewRows = filteredReportRows();
    const total = groups(viewRows, () => 1).get(1) || {turns:0, hits:0};
    byDate.clear();
    for (const row of data.rows) {
      if (!row.date || !onDate(row)) continue;
      if (!byDate.has(row.date)) byDate.set(row.date,{turns:0,hits:0,byClient:new Map()});
      const day = byDate.get(row.date);
      day.turns += row.turns;
      day.hits += row.hits;
      const n = day.byClient.get(row.client) || {turns:0,hits:0};
      n.turns += row.turns;
      n.hits += row.hits;
      day.byClient.set(row.client,n);
    }
    $("turns").textContent = hasData ? fmt.format(total.turns) : "—";
    $("hits").textContent = hasData ? fmt.format(total.hits) : "—";
    $("rate").textContent = rates(total.hits,total.turns);
    $("active-days").textContent = hasData ? fmt.format(new Set(viewRows.flatMap(row => row.date ? [row.date] : [])).size) : "—";
    const missing = viewRows.reduce((acc,row) => acc + (row.date ? 0 : row.turns),0);
    $("undated").textContent = missing ? fmt.format(missing) + " 条日期未知" : "";
    plot();
    breakdown(viewRows, total.turns);
    heatmap();
    if(current.day)selectDay(current.day);
    filterRecords();

  function heatmap() {
    const palette = ["#e8edf4","#ccd9fa","#a4b8f5","#6c8ce9","#3e5dc7"];
    const enabled = current.days || 90;
    const oldest = new Date(anchor);
    oldest.setUTCDate(oldest.getUTCDate() - (enabled - 1));
    const start = new Date(oldest);
    start.setUTCDate(start.getUTCDate() - ((start.getUTCDay()+6)%7));
    const host = $("heat-grid");
    host.replaceChildren();
    let lastMonth = -1;
    const max = Math.max(1, ...[...byDate].filter(([day]) => within(day,localDate(oldest))).map(([,n])=>n.turns));
    for (let week = new Date(start); week <= anchor; week.setUTCDate(week.getUTCDate()+7)) {
      const month = week.getUTCMonth();
      host.append(el("span","heat-month",month === lastMonth ? "" : month + 1 + "月"));
      lastMonth = month;
      for (let i=0; i<7; i++){
        const date=new Date(week);
        date.setUTCDate(date.getUTCDate()+i);
        if (date > anchor || date < oldest) { host.append(el("span","")); continue; }
        const day=localDate(date), n=bucket(day);
        const square=dateButton(day,"heat-day");
        const level=n.turns ? Math.min(4,Math.max(1,Math.ceil(4*Math.sqrt(n.turns/max)))) : 0;
        square.style.setProperty("--cell",palette[level]);
        square.dataset.hit = String(n.hits>0);
        host.append(square);
      }
    }
    host.style.setProperty("--weeks", Math.floor((anchor - start) / 604800000) + 1);
    $("heat-range").textContent = current.days ? "近 " + current.days + " 天" : "近 90 天";
  }

  function renderIndexChart(entries, tableRows) {
    const metric = indexView.metric;
    const ordered = entries.filter(entry => entry[metric] !== null)
      .sort((a,b) => b[metric] - a[metric] || indexTie(a,b));
    const shown = ordered.slice(0,6);
    $("index-chart").hidden = !entries.length;
    $("index-chart-count").textContent = ordered.length > shown.length ? "前 " + shown.length + " 组" : "";
    $("index-chart-empty").hidden = shown.length > 0;
    if (!shown.length) {
      $("index-bars").replaceChildren();
      return;
    }
    const max = Math.max(1,shown[0][metric]);
    const step = 10 ** Math.floor(Math.log10(max));
    const scale = [1,2,5,10].map(n => n * step).find(n => n >= max);
    const axis = el("div","index-chart-axis");
    axis.setAttribute("aria-hidden","true");
    const marks = el("span","");
    marks.append(el("span","","0"),el("span","",indexNumbers(metric,scale)));
    axis.append(el("span",""),marks);
    const bars = shown.map(entry => {
      const button = el("button","index-chart-row");
      button.type = "button";
      const model = entry.model || "模型未知";
      const label = el("span","index-chart-name");
      label.append(el("strong","",model),el("small","",entry.client));
      const track = el("span","index-chart-track");
      track.setAttribute("aria-hidden","true");
      const bar = el("i","index-chart-bar");
      bar.style.width = (100 * entry[metric] / scale) + "%";
      bar.style.setProperty("--bar-color",colors[entry.client]);
      track.append(bar);
      const value = el("span","index-chart-value");
      value.append(el("strong","",indexNumbers(metric,entry[metric])));
      if (metric === "score") value.append(el("small","",fmt.format(entry.hits) + " 次 / " + fmt.format(entry.turns) + " 条"));
      button.title = entry.client + " · " + model + " · 查看明细";
      button.append(label,track,value);
      button.addEventListener("click",()=>{
        const row = tableRows.get(entry.key);
        row.scrollIntoView({block:"center",inline:"nearest"});
        row.focus({preventScroll:true});
      });
      return button;
    });
    $("index-bars").replaceChildren(...bars,axis);
  }

  function renderIndex(rows) {
    const combinations = groups(rows, row => JSON.stringify([row.client, row.model]));
    const entries = [...combinations.entries()].map(([key, count]) => {
      const [client, model] = JSON.parse(key);
      return {key,client,model,...count,score: model && count.turns ? 1000 * count.hits / count.turns : null};
    }).filter(({model,turns,hits}) => {
      return (model || "模型未知").toLocaleLowerCase().includes(indexView.query)
        && turns >= indexView.minimum && (!indexView.hitsOnly || hits > 0);
    });
    const key = indexView.sort;
    entries.sort((a,b) => {
      const left = a[key], right = b[key];
      if (left === null || right === null) return Number(left === null) - Number(right === null) || indexTie(a,b);
      const diff = typeof left === "number" ? left - right : left.localeCompare(right);
      return indexView.direction * diff || indexTie(a,b);
    });
    for (const button of selected("[data-index-sort]")) {
      const active = button.dataset.indexSort === key;
      const header = button.closest("th");
      if (active) header.setAttribute("aria-sort",indexView.direction === 1 ? "ascending" : "descending");
      else header.removeAttribute("aria-sort");
      button.lastElementChild.textContent = active ? (indexView.direction === 1 ? "↑" : "↓") : "↕";
    }
    $("index-empty").hidden = entries.length > 0;
    $("index-empty").textContent = hasData ? "没有符合筛选条件的组合。" : "正在统计…";
    $("index-table").hidden = !entries.length;
    $("index-count").textContent = hasData ? fmt.format(entries.length) + " 个组合" : "";
    const tableRows = new Map();
    $("index-rows").replaceChildren(...entries.map(({key,client,model,turns,hits,score}) => {
      const row = el("tr","");
      row.tabIndex = -1;
      row.toggleAttribute("data-unknown",score === null);
      const harness = el("td","index-harness");
      harness.append(marker(colors[client]),client);
      row.append(harness,el("td",model ? "" : "subtle",model || "模型未知"),
        el("td","",fmt.format(turns)),el("td","",fmt.format(hits)),
        el("td","",score === null ? "—" : indexNumbers("score",score)));
      tableRows.set(key,row);
      return row;
    }));
    renderIndexChart(entries,tableRows);
  }

  const menuClosers = [];
  function filterMenu(id, onSelect) {
    const component = $(id + "-filter");
    const trigger = $(id + "-trigger");
    const list = $(id + "-options");
    const options = [...list.querySelectorAll("button")];
    const label = trigger.getAttribute("aria-label");
    const selectedOption = () => options.find(button => button.getAttribute("aria-selected") === "true");
    let open = false;
    function close(restoreFocus = false) {
      if (!open) return;
      open = false;
      list.hidden = true;
      component.removeAttribute("data-opens-up");
      trigger.setAttribute("aria-expanded", "false");
      if (restoreFocus) trigger.focus();
    }
    function show(initial = selectedOption()) {
      for (const closeOther of menuClosers) closeOther();
      open = true;
      list.hidden = false;
      if (component.closest("dialog")) {
        const bounds = list.getBoundingClientRect();
        const roomAbove = trigger.getBoundingClientRect().top;
        component.toggleAttribute("data-opens-up", bounds.bottom > window.innerHeight - 8 && roomAbove > bounds.height + 8);
      }
      trigger.setAttribute("aria-expanded", "true");
      initial.focus();
    }
    menuClosers.push(close);
    trigger.addEventListener("click", () => open ? close(true) : show());
    trigger.addEventListener("keydown", event => {
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        if (!open) show(event.key === "ArrowUp" ? options.at(-1) : selectedOption());
      }
    });
    function setOption(option) {
      for (const item of options) item.setAttribute("aria-selected", String(item === option));
      trigger.firstElementChild.textContent = option.textContent;
      trigger.setAttribute("aria-label", label + "：" + option.textContent);
    }
    for (const option of options) option.addEventListener("click", () => {
      setOption(option);
      close(true);
      onSelect(option.dataset.value);
    });
    list.addEventListener("keydown", event => {
      const index = options.indexOf(document.activeElement);
      const next = {ArrowDown: (index + 1) % options.length, ArrowUp: (index + options.length - 1) % options.length,
        Home: 0, End: options.length - 1}[event.key];
      if (next !== undefined) {
        event.preventDefault();
        options[next].focus();
      } else if (event.key === "Escape") {
        event.preventDefault();
        close(true);
      }
    });
    component.addEventListener("focusout", event => {
      if (event.relatedTarget && !component.contains(event.relatedTarget)) close();
    });
    document.addEventListener("click", event => {
      if (!component.contains(event.target)) close();
    });
    return {
      trigger, close, get value() { return selectedOption().dataset.value; },
      setValue(value) { setOption(options.find(option => option.dataset.value === value)); }
    };
  }

      card.append(title,el("p","",status));
      if(source.found){
        const detail=[fmt.format(source.files)+" 个会话文件"];
        if(source.compressed)detail.push(fmt.format(source.compressed)+" 个压缩文件");
        if(source.archived)detail.push(fmt.format(source.archived)+" 个归档文件");
        if(source.history_turns)detail.push(fmt.format(source.history_turns)+" 条由输入历史补录");
        card.append(el("small","",detail.join(" · ")));
        if(source.versioned_turns)card.append(el("small","",fmt.format(source.versioned_turns)+" 条有工具版本"));
        const skipped=[];
        if(source.ignored)skipped.push(source.ignored+" 个子代理或自动评审");
        if(source.duplicates)skipped.push(source.duplicates+" 个重复会话文件");
        if(source.errors)skipped.push(source.errors+" 个读取异常");
        if(source.malformed)skipped.push(source.malformed+" 行无法解析");
        if(skipped.length)card.append(el("small","",skipped.join(" · ")));
        const calendar = [];
        if(source.inferred_neighbors)calendar.push(fmt.format(source.inferred_neighbors)+" 条由同日相邻消息补齐");
        if(source.inferred_file_days)calendar.push(fmt.format(source.inferred_file_days)+" 条按文件日期推断");
        if(source.missing_days)calendar.push(fmt.format(source.missing_days)+" 条日期未知");
        if(calendar.length)card.append(el("small","",calendar.join(" · ")));
      }
      sourceList.append(card);
    }
  }
  renderSources();
  refreshData();
  if(rescan && window.ipc)window.ipc.postMessage("report-ready");
}
</script>
</body>
</html>
