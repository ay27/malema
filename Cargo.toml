[package]
name = "malema"
version = "0.5.11"
edition = "2024"

[package.metadata.malema]
bundle-version = 26

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
unicode-normalization = "0.1"
walkdir = "2"
zstd = "0.13"
rusqlite = "0.37"
time = { version = "0.3", features = ["local-offset", "parsing"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSEvent", "NSImage", "NSMenu", "NSMenuItem", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSArray", "NSBundle", "NSLocale", "NSString", "NSURL"] }
tao = "0.34"
url = "2.5"
wry = { version = "0.53", default-features = false, features = ["protocol"] }

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 1
